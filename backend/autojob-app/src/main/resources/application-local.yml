spring:
  data:
    mongodb:
      host: 127.0.0.1
      port: 27018
      database: autojob
      username: root
      password: password
      authentication-database: admin
      auto-index-creation: true

autojob:
  embedding:
    base-url: ${EMBEDDING_SERVICE_BASE_URL:http://localhost:8002}
    expected-dimension: ${EMBEDDING_EXPECTED_DIMENSION:384}
    expected-version: "${EMBEDDING_EXPECTED_VERSION:intfloat/multilingual-e5-small@c007d7ef6fd86656326059b28395a7a03a7c5846|prep-v1|l2}"
    connect-timeout: 3s
    response-timeout: 30s
    max-error-length: 1000

  qdrant:
    base-url: ${QDRANT_BASE_URL:http://localhost:6333}
    collection: ${QDRANT_JOB_COLLECTION:job_vectors_v1}
    dimension: ${QDRANT_VECTOR_DIMENSION:384}
    distance: ${QDRANT_DISTANCE:Cosine}
    connect-timeout: 3s
    response-timeout: 10s

  crawler:
    mock:
      source-code: MOCK
      base-url: http://localhost:18080
      list-url: http://localhost:18080/jobs.html
      request-delay-ms: 300
      store-raw-html: false
      store-raw-text: false
      raw-text-max-chars: 20000
      raw-retention-days: 30

    itviec:
      source-code: ITVIEC
      base-url: https://itviec.com
      list-url: https://itviec.com/it-jobs
      request-delay-ms: 3000
      store-raw-html: false
      store-raw-text: false
      raw-text-max-chars: 20000
      raw-retention-days: 30

    joboko:
      source-code: JOBOKO
      base-url: https://vn.joboko.com
      list-url: https://vn.joboko.com/viec-lam-moi
      request-delay-ms: 3000
      store-raw-html: false
      store-raw-text: false
      raw-text-max-chars: 20000
      raw-retention-days: 30

    topdev:
      source-code: TOPDEV
      base-url: https://topdev.vn
      list-url: https://topdev.vn/jobs/search
      request-delay-ms: 3000
      store-raw-html: false
      store-raw-text: false
      raw-text-max-chars: 20000
      raw-retention-days: 30

    vieclam24h:
      source-code: VIECLAM24H
      base-url: https://vieclam24h.vn
      list-url: https://vieclam24h.vn/viec-lam-toan-quoc-p136.html
      request-delay-ms: 3000
      store-raw-html: false
      store-raw-text: false
      raw-text-max-chars: 20000
      raw-retention-days: 30

logging:
  level:
    com.autojob: INFO
    org.apache.camel: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      show-components: always