# TODO: add services and infrastructure configuration.
services:
  mongo:
    image: mongo:7
    container_name: autojob-mongo
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-password}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-autojob}
    volumes:
      - mongo_data:/data/db

  qdrant:
    image: qdrant/qdrant:v1.10.1
    container_name: autojob-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  minio:
    image: minio/minio:RELEASE.2024-07-16T23-46-41Z
    container_name: autojob-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data

  mock-job-site:
    image: nginx:1.27-alpine
    container_name: autojob-mock-job-site
    restart: unless-stopped
    ports:
      - "${MOCK_JOB_SITE_PORT:-18080}:80"
    volumes:
      - ./mock-sites/mock-job-site:/usr/share/nginx/html:ro

volumes:
  mongo_data:
  qdrant_data:
  minio_data: