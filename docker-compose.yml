services:
  mongo:
    image: mongo:7
    container_name: autojob-mongo
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27018}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-password}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-autojob}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: >
        mongosh --quiet
        -u "$$MONGO_INITDB_ROOT_USERNAME"
        -p "$$MONGO_INITDB_ROOT_PASSWORD"
        --authenticationDatabase admin
        --eval "db.adminCommand({ ping: 1 }).ok"
        admin | grep 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  qdrant:
    image: qdrant/qdrant:v1.10.1
    container_name: autojob-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  minio:
    image: minio/minio:RELEASE.2024-07-16T23-46-41Z
    container_name: autojob-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:RELEASE.2024-07-15T17-46-06Z
    container_name: autojob-minio-init
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET_CVS: ${MINIO_BUCKET_CVS:-autojob-cvs}
    entrypoint: >
      /bin/sh -c "
      echo 'Waiting for MinIO...';
      until mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD; do
        echo 'MinIO not ready yet...';
        sleep 2;
      done;
      mc mb -p local/$$MINIO_BUCKET_CVS || true;
      mc anonymous set none local/$$MINIO_BUCKET_CVS || true;
      echo 'MinIO bucket ready: '$$MINIO_BUCKET_CVS;
      "

  mock-job-site:
    image: nginx:1.27-alpine
    container_name: autojob-mock-job-site
    restart: unless-stopped
    ports:
      - "${MOCK_JOB_SITE_PORT:-18080}:80"
    volumes:
      - ./mock-sites/mock-job-site:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/jobs.html"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  mongo_data:
  qdrant_data:
  minio_data: