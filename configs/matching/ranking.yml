autojob:
  matching:

    # r7:
    #
    # - primary/secondary skill scoring
    # - explicit known/unknown component state
    # - secondary skills excluded from professional missingSkills
    # - freshness only trusts crawler-derived postedAt
    # - strong skill threshold = 0.70
    # - strong semantic threshold = 0.70
    # - component scores are not reused as ranking tie-breakers
    #
    # Version bump invalidates persisted results calculated
    # with the previous ranking order.
    version: ${MATCHING_VERSION:hybrid-v6-balanced-r7}

    retrieval:
      candidate-pool-size: ${MATCHING_CANDIDATE_POOL_SIZE:100}
      result-limit: ${MATCHING_RESULT_LIMIT:20}

    compatibility:
      normalization-version: ${MATCHING_NORMALIZATION_VERSION:rule-v4}
      candidate-text-version: ${MATCHING_CANDIDATE_TEXT_VERSION:candidate-text-v1}
      job-text-version: ${MATCHING_JOB_TEXT_VERSION:job-text-v2}

    weights:
      semantic: ${MATCHING_WEIGHT_SEMANTIC:0.40}
      skill: ${MATCHING_WEIGHT_SKILL:0.40}
      seniority: ${MATCHING_WEIGHT_SENIORITY:0.10}
      location: ${MATCHING_WEIGHT_LOCATION:0.05}
      freshness: ${MATCHING_WEIGHT_FRESHNESS:0.05}

    freshness:
      fresh-days: ${MATCHING_FRESH_DAYS:7}
      max-age-days: ${MATCHING_MAX_AGE_DAYS:30}

    semantic-calibration:
      lower-percentile: ${MATCHING_SEMANTIC_LOWER_PERCENTILE:0.10}
      upper-percentile: ${MATCHING_SEMANTIC_UPPER_PERCENTILE:0.90}
      minimum-spread: ${MATCHING_SEMANTIC_MINIMUM_SPREAD:0.04}
      raw-floor: ${MATCHING_SEMANTIC_RAW_FLOOR:0.75}
      raw-ceiling: ${MATCHING_SEMANTIC_RAW_CEILING:0.95}
      relative-weight: ${MATCHING_SEMANTIC_RELATIVE_WEIGHT:0.65}

    skill-scoring:

      core-weight: ${MATCHING_SKILL_CORE_WEIGHT:1.0}

      # SECONDARY skill chỉ cộng bonus nhỏ.
      generic-weight: ${MATCHING_SKILL_GENERIC_WEIGHT:0.10}

      # Chỉ match SECONDARY thì không được coi là
      # professional skill fit.
      generic-only-cap: ${MATCHING_SKILL_GENERIC_ONLY_CAP:0.05}

      skills-section-confidence: ${MATCHING_SKILL_EVIDENCE_SKILLS_SECTION:1.0}
      work-experience-confidence: ${MATCHING_SKILL_EVIDENCE_WORK_EXPERIENCE:1.0}
      project-confidence: ${MATCHING_SKILL_EVIDENCE_PROJECTS:0.65}
      profile-text-confidence: ${MATCHING_SKILL_EVIDENCE_PROFILE_TEXT:0.55}
      scoped-text-confidence: ${MATCHING_SKILL_EVIDENCE_SCOPED_TEXT:0.50}
      unknown-evidence-confidence: ${MATCHING_SKILL_EVIDENCE_UNKNOWN:0.50}

    acceptance:

      minimum-final-score: ${MATCHING_ACCEPT_MIN_FINAL:0.45}

      minimum-semantic-score: ${MATCHING_ACCEPT_MIN_SEMANTIC:0.50}

      minimum-skill-score: ${MATCHING_ACCEPT_MIN_SKILL:0.10}

      # 70%+ skill fit được coi là strong.
      strong-skill-score: ${MATCHING_ACCEPT_STRONG_SKILL:0.70}

      # Semantic fallback cũng ở 70%.
      strong-semantic-score: ${MATCHING_ACCEPT_STRONG_SEMANTIC:0.70}

      minimum-non-contradictory-structured-score: ${MATCHING_ACCEPT_MIN_STRUCTURED:0.10}