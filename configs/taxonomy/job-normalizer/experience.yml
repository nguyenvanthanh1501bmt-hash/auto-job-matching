autojob:
  normalization:
    taxonomy:
      experience:

        units:

          - unit: YEAR
            aliases:
              - year
              - years
              - yr
              - yrs
              - nam

          - unit: MONTH
            aliases:
              - month
              - months
              - mo
              - mos
              - thang

        no-experience-phrases:
          - khong yeu cau kinh nghiem
          - khong can kinh nghiem
          - chua co kinh nghiem
          - no experience required
          - no experience
          - fresher
          - fresh graduate

        # Dấu -, –, — vẫn được parser Java xử lý.
        range-words:
          - den
          - to

        upper-bound-phrases:
          - "duoi "
          - "under "
          - less than
          - up to
          - khong qua
          - toi da

        lower-bound-phrases:
          - it nhat
          - at least
          - "tu "
          - "from "
          - "tren "
          - "over "
          - more than
          - minimum
          - toi thieu

        # -------------------------------------------------------
        # Context fallback
        # -------------------------------------------------------
        #
        # Chỉ khi rawJob.experienceText không dùng được,
        # ExperienceNormalizer mới tìm những phrase này
        # trong requirements / description.
        #
        # Text được fold lowercase + bỏ dấu trước khi match.
        #
        # Đây là rule chung cho mọi domain.
        context-phrases:
          - kinh nghiem
          - so nam kinh nghiem
          - tham nien
          - experience
          - work experience
          - professional experience
          - relevant experience
          - years of experience
          - year of experience
          - yrs of experience
          - months of experience
          - month of experience

        # Chỉ nhìn local context quanh experience phrase.
        #
        # Tránh:
        #
        # graduation year = 2025
        # team size = 5
        # salary = 20 triệu
        #
        # bị hiểu nhầm thành experience.
        context-window-chars: 120